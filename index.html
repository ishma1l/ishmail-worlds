<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ishmail Worlds</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/fonts.css?v=1794681761">
<link rel="stylesheet" href="css/core.css?v=1794681761">
<link rel="stylesheet" href="css/intro.css?v=1794681761">
<link rel="stylesheet" href="css/gotham.css?v=1794681761">
<link rel="stylesheet" href="css/porsche.css?v=1794681761">
<link rel="stylesheet" href="css/lifestyle.css?v=1794681761">
</head>
<body>
<div id="viewport">
<div id="stage">

  <!-- =========================== WELCOME =========================== -->
  <section id="intro" class="screen active">
    <div class="beams"><i></i><i></i><i></i><i></i></div>
    <canvas id="dust" width="1920" height="1080"></canvas>
    <div class="intro-title">
      <div class="it-1"></div>
      <div class="it-2"></div>
      <div class="it-flare"></div>
    </div>
    <div class="doors">
      <button class="door d-gotham" data-world="gotham">
        <span class="door-media"><video muted loop playsinline data-slot="gotham/background"></video></span>
        <span class="door-name">GOTHAM</span>
        <span class="door-timer"><i></i></span>
      </button>
      <button class="door d-porsche" data-world="porsche">
        <span class="door-media"><video muted loop playsinline data-slot="porsche/background"></video></span>
        <span class="door-name">PORSCHE</span>
        <span class="door-timer"><i></i></span>
      </button>
      <button class="door d-lifestyle" data-world="lifestyle">
        <span class="door-media"><video muted loop playsinline data-slot="lifestyle/background"></video></span>
        <span class="door-name">Business <em>&amp;</em> Lifestyle</span>
        <span class="door-timer"><i></i></span>
      </button>
    </div>
  </section>

  <!-- =========================== WORLDS =========================== -->
  <div id="app" data-world="gotham">
    <header id="topbar">
      <div class="tb-title"></div>
      <nav class="tb-dots"><button data-go="gotham"></button><button data-go="porsche"></button><button data-go="lifestyle"></button></nav>
      <div class="tb-right">
        <button class="tb-sound" data-focus="sound" aria-label="Sound"><span class="snd-on">Sound on</span><span class="snd-off">Sound off</span></button>
        <div class="tb-clock"><b data-clock="hm"></b><small data-clock="date"></small></div>
      </div>
    </header>
    <button class="edge prev" data-dir="-1"><i></i><span></span></button>
    <button class="edge next" data-dir="1"><span></span><i></i></button>

    <!-- ---------------- GOTHAM: the cave ---------------- -->
    <section id="w-gotham" class="world">
      <video class="bg" muted loop playsinline data-slot="gotham/background"></video>
      <div class="g-grade"></div>
      <div class="g-beam a"></div><div class="g-beam b"></div><div class="g-beam c"></div>
      <canvas class="g-rain" width="1920" height="1080"></canvas>
      <div class="g-flash"></div>
      <svg class="g-cave" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010204"/><stop offset="1" stop-color="#05080e"/></linearGradient>
          <radialGradient id="rim" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#2a4a78" stop-opacity=".35"/><stop offset=".6" stop-color="#2a4a78" stop-opacity="0"/></radialGradient>
        </defs>
        <path fill="url(#rock)" d="M0 0H1920V40C1830 70 1800 150 1760 120 1720 95 1700 190 1650 160 1610 135 1580 60 1520 80 1470 98 1440 40 1380 55 1330 70 1300 20 1240 30 1180 40 1150 10 1090 25 1040 38 1000 12 960 20 910 30 880 8 820 24 760 40 740 12 680 30 620 48 600 20 540 40 480 60 460 110 400 85 350 62 320 140 270 120 220 98 200 190 150 165 110 140 70 60 0 50Z"/>
        <path fill="url(#rock)" d="M0 1080V700C30 720 50 820 80 880 110 940 90 1000 140 1080Z"/>
        <path fill="url(#rock)" d="M1920 1080V680C1890 700 1872 800 1840 870 1808 940 1830 1010 1780 1080Z"/>
        <path fill="url(#rim)" d="M0 0H1920V160H0Z"/>
      </svg>

      <div class="g-wall">
        <div class="g-wing left">
          <button class="mon feed" data-focus data-slot="gotham/feed-1"><video muted loop playsinline></video><span class="mon-label"></span></button>
          <button class="mon feed" data-focus data-slot="gotham/feed-2"><video muted loop playsinline></video><span class="mon-label"></span></button>
        </div>
        <div class="g-center">
          <button class="g-hero featured" data-focus data-featured="gotham"><span class="feat-media"></span><span class="hero-cap"></span></button>
          <button class="open-original" data-focus="original" data-world-original="gotham"></button>
        </div>
        <div class="g-wing right">
          <button class="mon feed" data-focus data-slot="gotham/feed-3"><video muted loop playsinline></video><span class="mon-label"></span></button>
          <button class="mon feed" data-focus data-slot="gotham/feed-4"><video muted loop playsinline></video><span class="mon-label"></span></button>
        </div>
      </div>

      <div class="g-desk">
        <div class="g-table"><svg class="g-map" viewBox="0 0 1000 560" aria-hidden="true"></svg><div class="g-sweep"></div></div>
        <div class="g-wordmark">GOTHAM</div>
      </div>
      <div class="g-bats"></div>
    </section>

    <!-- ---------------- PORSCHE: the private studio ---------------- -->
    <section id="w-porsche" class="world">
      <video class="bg" muted loop playsinline data-slot="porsche/background"></video>
      <div class="p-shade"></div>
      <div class="p-ceiling"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="p-floor"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="p-hero-wrap">
        <button class="p-hero featured" data-focus data-featured="porsche"><span class="feat-media"></span><span class="p-glass"></span><span class="hero-cap"></span></button>
        <div class="p-track">
          <svg viewBox="0 0 1150 40" preserveAspectRatio="none"><path class="p-track-line" d="M0 30 C120 30 160 8 300 8 S470 30 600 30 760 6 900 10 1060 30 1150 28"/><path class="p-track-done" d="M0 30 C120 30 160 8 300 8 S470 30 600 30 760 6 900 10 1060 30 1150 28"/><circle class="p-car" r="6"/></svg>
          <span class="p-time"></span>
          <button class="open-original" data-focus="original" data-world-original="porsche"></button>
        </div>
      </div>
      <div class="p-stack">
        <button class="p-disp" data-focus data-slot="porsche/display-1"><video muted loop playsinline></video><span class="p-cap"></span></button>
        <button class="p-disp" data-focus data-slot="porsche/display-2"><video muted loop playsinline></video><span class="p-cap"></span></button>
        <button class="p-disp" data-focus data-slot="porsche/display-3"><video muted loop playsinline></video><span class="p-cap"></span></button>
        <button class="p-disp" data-focus data-slot="porsche/display-4"><video muted loop playsinline></video><span class="p-cap"></span></button>
      </div>
    </section>

    <!-- ---------------- BUSINESS & LIFESTYLE: the members' room ---------------- -->
    <section id="w-lifestyle" class="world">
      <video class="bg" muted loop playsinline data-slot="lifestyle/background"></video>
      <div class="l-room"></div>
      <div class="l-panel left"></div><div class="l-panel right"></div>
      <canvas class="l-dust" width="1920" height="1080"></canvas>

      <div class="l-dest">
        <div class="l-window"><video class="a" muted loop playsinline></video><video class="b" muted loop playsinline></video><span class="l-window-name"></span></div>
        <ul class="l-list"></ul>
      </div>

      <div class="l-centre">
        <button class="l-hero featured" data-focus data-featured="lifestyle"><span class="feat-media"></span><span class="hero-cap"></span></button>
        <button class="l-strip" data-focus data-slot="lifestyle/collection-5"><video muted loop playsinline></video><span class="l-quote"></span></button>
        <button class="open-original" data-focus="original" data-world-original="lifestyle"></button>
      </div>

      <div class="l-coll">
        <button class="l-frame" data-focus data-slot="lifestyle/collection-1"><video muted loop playsinline></video><span class="l-cap"></span></button>
        <button class="l-frame" data-focus data-slot="lifestyle/collection-2"><video muted loop playsinline></video><span class="l-cap"></span></button>
        <button class="l-frame" data-focus data-slot="lifestyle/collection-3"><video muted loop playsinline></video><span class="l-cap"></span></button>
        <button class="l-frame" data-focus data-slot="lifestyle/collection-4"><video muted loop playsinline></video><span class="l-cap"></span></button>
      </div>
    </section>

    <div id="hint"></div>
  </div>

  <!-- =========================== FULL-SCREEN PLAYER =========================== -->
  <div id="theatre">
    <div class="th-media"></div>
    <div class="th-ui">
      <div class="th-title"></div>
      <div class="th-progress"><i></i></div>
      <div class="th-row">
        <span class="th-time"></span>
        <div class="th-buttons">
          <button data-act="back10" class="th-btn">−10s</button>
          <button data-act="play" class="th-btn th-play">Pause</button>
          <button data-act="fwd10" class="th-btn">+10s</button>
          <button data-act="sound" class="th-btn">Sound on</button>
          <button data-act="original" class="th-btn">Open original</button>
          <button data-act="close" class="th-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="veil"></div>
  <div id="toast"></div>
</div>
</div>

<script src="js/config.js?v=1794681761"></script>
<script src="js/audio.js?v=1794681761"></script>
<script src="js/fx.js?v=1794681761"></script>
<script src="js/media.js?v=1794681761"></script>
<script src="js/remote.js?v=1794681761"></script>
<script src="js/app.js?v=1794681761"></script>
</body>
</html>
